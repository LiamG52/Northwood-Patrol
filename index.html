<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1422"><title>Northwood Patrol — v0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081219;color:#f3ede1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:9px;pointer-events:none}#hud>*{pointer-events:auto}#info{background:linear-gradient(180deg,#101d29f5,#0a141fe9);border:2px solid #506775;border-left:4px solid #d6af63;border-radius:3px;padding:9px 12px;box-shadow:0 8px 22px #0008;font-size:12px;max-width:70%;line-height:1.5}#info strong{font-size:14px;color:#f0d192;letter-spacing:.05em}#menu{background:linear-gradient(180deg,#1b3140eb,#12222dea);border:2px solid #637e8c;color:#f5eddf;border-radius:4px;padding:11px;font-weight:700}#message{position:absolute;top:85px;left:50%;transform:translateX(-50%);width:min(92%,440px);background:#091720f5;border:2px solid #d3aa61;border-radius:4px;padding:11px;text-align:center;font-size:13px;display:none;pointer-events:none}#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}#stick{width:128px;height:128px;border-radius:50%;border:2px solid #abc1d788;background:radial-gradient(circle,#1e40529d,#0c1e2b9e);position:relative;pointer-events:auto;touch-action:none}#nub{position:absolute;width:52px;height:52px;background:#91b2bfcc;border:2px solid #f4e9ce;border-radius:50%;left:36px;top:36px}#actions{display:flex;gap:8px;pointer-events:auto}button{touch-action:manipulation}#actions button{height:65px;min-width:68px;border-radius:8px;background:linear-gradient(180deg,#1c3b50,#102637);color:white;border:2px solid #7097ac;font-weight:800;font-size:12px}#actions #act{background:#80632e;border-color:#efd294}#panel{display:none;position:absolute;inset:12% 6%;background:#0b1924f7;border:3px solid #657f8e;border-radius:6px;padding:20px;overflow-y:auto;touch-action:pan-y;z-index:4}#panel h2{margin:0 0 12px}#panel button{border:1px solid #8abfe7;background:#183755;color:#fff;border-radius:8px;padding:12px;margin-top:12px;width:100%}.muted{color:#b8c6cc;font-size:13px}#hint{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#b4c9df;font-size:10px;pointer-events:none}@media(min-width:750px){#stick{width:110px;height:110px}#nub{left:29px;top:29px}#actions button{height:58px}}

#hud small{font-size:9px;color:#f4b963}#info{min-width:192px}#message{box-shadow:0 10px 28px #000a}#controls{z-index:3}#panel{box-shadow:0 20px 45px #000b}#actions button:active,#menu:active{filter:brightness(1.22)}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div id="info"><strong>★ NORTHWOOD PATROL <small>V0.4</small></strong><div id="status">UNIT P-1 · Available</div><div id="objective">Respond to dispatch</div></div><button id="menu">📋 Casebook</button></div>
<div id="message"></div><div id="controls"><div id="stick"><div id="nub"></div></div><div id="actions"><button id="act">ACT</button><button id="drive">ENTER CAR</button></div></div><div id="hint">Move with joystick · ACT near objects · CAR by cruiser</div>
<div id="panel"><h2>📋 Casebook</h2><div id="caseinfo"></div><button id="close">Return to Patrol</button><button id="restart">Restart Case</button></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),msg=document.getElementById('message'),status=document.getElementById('status'),objective=document.getElementById('objective');
const W=2200,H=1600;let vw=0,vh=0,scale=1,camX=0,camY=0,frame=0,noticeUntil=0;
const blocks=[{x:160,y:120,w:420,h:250,c:'#6c849a',name:'POLICE STATION'},{x:870,y:125,w:370,h:235,c:'#827fa0',name:'APARTMENTS'},{x:1560,y:130,w:480,h:255,c:'#a18967',name:'MARKET'},{x:170,y:850,w:430,h:280,c:'#967765',name:'NORTHWOOD ELECTRONICS'},{x:850,y:870,w:430,h:260,c:'#708777',name:'CLINIC'},{x:1570,y:870,w:410,h:260,c:'#988f73',name:'WAREHOUSE'}];
const objects=[{x:360,y:470,kind:'station',icon:'★',label:'Station'},{x:710,y:705,kind:'car',icon:'🚔',label:'Patrol car'},{x:490,y:1195,kind:'scene',icon:'!',label:'Crime scene'},{x:375,y:1242,kind:'glass',icon:'◆',label:'Broken glass'},{x:580,y:1190,kind:'print',icon:'◆',label:'Shoe print'},{x:505,y:1330,kind:'camera',icon:'◆',label:'Camera footage'},{x:760,y:1205,kind:'witness',icon:'●',label:'Witness'},{x:1320,y:1240,kind:'suspect',icon:'●',label:'Suspect'}];
let player={x:700,y:710},car={x:710,y:705},driving=false,caseStage=0,evidence=new Set(),witness=false,questioned=false,arrested=false,finished=false;let prisoner={x:1320,y:1240},custody='none';
let motion={x:0,y:0},keys={};let tlast=performance.now(),moving=false,walkPhase=0,faceX=0,faceY=1,driveAngle=0;
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(vw*d);c.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
function say(s){msg.textContent=s;msg.style.display='block';noticeUntil=performance.now()+4700}
const jailPoint={x:360,y:470};
function blocked(x,y,r=14){if(x<24+r||y<24+r||x>W-24-r||y>H-24-r)return true;return blocks.some(b=>x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)}
function moveSolid(actor,dx,dy,r){const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/9));for(let i=0;i<n;i++){const nx=actor.x+dx/n;if(!blocked(nx,actor.y,r))actor.x=nx;const ny=actor.y+dy/n;if(!blocked(actor.x,ny,r))actor.y=ny}}
function safeExit(x,y){for(const [dx,dy] of [[49,0],[-49,0],[0,56],[0,-56],[55,55],[-55,55]])if(!blocked(x+dx,y+dy,14))return{x:x+dx,y:y+dy};return{x,y}}
function followPrisoner(dt){if(custody!=='escort'||!arrested)return;const dx=player.x-prisoner.x,dy=player.y-prisoner.y,d=Math.hypot(dx,dy);if(d>37){const step=Math.min(d-37,Math.max(3.6*dt,3.6*dt*(d/80)));moveSolid(prisoner,dx/d*step,dy/d*step,12)}}
function updateText(){const nearCar=Math.hypot(player.x-car.x,player.y-car.y)<125;const carButton=document.getElementById('drive');carButton.textContent=driving?'EXIT CAR':nearCar?'ENTER CAR':'🚔 FIND CAR';carButton.style.opacity=(driving||nearCar)?'1':'.65';status.textContent='UNIT P-1 · '+(finished?'Case closed':custody==='vehicle'?'Prisoner in cruiser':custody==='escort'?'Escorting prisoner':driving?'On patrol (vehicle)':'On foot');objective.textContent=finished?'Suspect booked · Case closed':custody==='vehicle'?'Drive to station · park and book prisoner':custody==='escort'?'Escort suspect to car · then to station jail':questioned&&evidence.size===3&&witness?'Arrest the suspect':'Collect evidence and interview witnesses'}
function nearest(max=115){let b=null,d=max;for(const o of objects){if(o.kind==='suspect'&&arrested)continue;if(o.kind==='car'&&driving)continue;const x=o.kind==='car'?car.x:o.x,y=o.kind==='car'?car.y:o.y;const dist=Math.hypot(player.x-x,player.y-y);if(dist<d){b=o;d=dist}}return b}
function interact(){if(driving){say('Park and exit the cruiser before investigating or booking a prisoner.');return}let o=nearest();if(!o){say('Move closer to a marked location to interact.');return}
switch(o.kind){
case 'car':toggleCar();break;
case 'scene':say('Dispatch: 10-31, burglary at Northwood Electronics. Investigate the scene and gather evidence.');caseStage=Math.max(caseStage,1);break;
case 'glass':case 'print':case 'camera':
if(!evidence.has(o.kind)){evidence.add(o.kind);say(({glass:'Evidence bagged: shattered window glass.',print:'Evidence photographed: fresh shoe print.',camera:'CCTV recovered: blue-jacketed suspect seen leaving.'})[o.kind]);}else say('Evidence already collected.');break;
case 'witness':witness=true;say('Witness: “I heard glass break. Someone in a blue jacket ran east toward the warehouse!”');break;
case 'suspect':
if(arrested){say('Suspect is already handcuffed. Escort them to your cruiser.');break}
if(!questioned){questioned=true;say('Suspect: “I was nowhere near the electronics store!” You note their blue jacket.');}
else if(evidence.size>=3&&witness){arrested=true;custody='escort';prisoner.x=o.x;prisoner.y=o.y;say('Suspect handcuffed! They will follow you. Escort them to your cruiser, load them, and drive to jail.');}
else say('Not enough evidence for an arrest. Find all 3 clues and interview the witness.');break;
case 'station':
if(arrested&&!finished&&custody==='escort'&&Math.hypot(prisoner.x-jailPoint.x,prisoner.y-jailPoint.y)<145&&Math.hypot(player.x-prisoner.x,player.y-prisoner.y)<125){finished=true;custody='booked';say('BOOKING COMPLETE! Suspect secured in the Northwood station jail. Case NW-001 closed. 🎖️')}
else if(arrested&&!finished&&custody==='vehicle')say('Prisoner is still in the cruiser. Park, exit and escort them to booking.')
else if(arrested&&!finished)say('Bring the handcuffed suspect with you to the jail booking entrance. They must be nearby.')
else say('Northwood Police Station. Dispatch: investigate the burglary and bring the suspect to booking.');break;
}updateText()}
function toggleCar(){
if(driving){driving=false;const p=safeExit(car.x,car.y);player.x=p.x;player.y=p.y;if(custody==='vehicle'){custody='escort';prisoner.x=player.x+20;prisoner.y=player.y+23;say('Suspect unloaded from rear seat. Escort them to the station jail entrance and press ACT.')}else say('Cruiser parked. Continue on foot.');updateText();return}
if(Math.hypot(player.x-car.x,player.y-car.y)>125){say('Walk closer to your police cruiser to enter.');return}
if(custody==='escort'){if(Math.hypot(prisoner.x-car.x,prisoner.y-car.y)>105){say('Suspect is too far from the cruiser. Escort them closer before loading.');return}custody='vehicle';say('Suspect secured in rear seat. Drive to NORTHWOOD POLICE STATION to book them.')}
else say('Cruiser ready! Same joystick to drive. Tap EXIT CAR to park.');
driving=true;player.x=car.x;player.y=car.y;updateText()}
document.getElementById('act').onclick=interact;document.getElementById('drive').onclick=toggleCar;
const panel=document.getElementById('panel');function showPanel(){const clues=['glass','print','camera'].map(k=>(evidence.has(k)?'✅ ':'⬜ ')+({glass:'Window glass',print:'Shoe print',camera:'Security footage'})[k]).join('<br>');document.getElementById('caseinfo').innerHTML='<p><b>Case 001: Electronics Break-In</b></p><p class="muted">Northwood Electronics was burglarized. Investigate, question the witness, identify the suspect, then return to the station.</p><p>'+clues+'</p><p>'+(witness?'✅':'⬜')+' Witness interviewed</p><p>'+(questioned?'✅':'⬜')+' Suspect questioned</p><p>'+(arrested?'✅':'⬜')+' Suspect arrested</p><p>'+(custody==='vehicle'?'🚔 In cruiser':custody==='escort'?'🚶 Being escorted':custody==='booked'?'🔒 Booked in jail':'⬜ Not in custody')+'</p><p>'+(finished?'🏆 Case closed':'📻 Case active')+'</p><p class="muted">Tip: Yellow icons mark people and locations. Cyan diamonds mark evidence. Use ACT to interact. Tap CAR near your cruiser to drive.</p>';panel.style.display='block';motion={x:0,y:0}}
document.getElementById('menu').onclick=showPanel;document.getElementById('close').onclick=()=>panel.style.display='none';document.getElementById('restart').onclick=()=>{evidence.clear();witness=false;questioned=false;arrested=false;finished=false;driving=false;custody='none';prisoner={x:1320,y:1240};player={x:700,y:710};car={x:710,y:705};panel.style.display='none';say('New shift: Unit P-1, respond to Northwood Electronics.');updateText()};
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let pointer=null;
function stickMove(e){const rect=stick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,r=Math.min(rect.width*.30,len);motion.x=dx/len*Math.min(1,len/(rect.width*.30));motion.y=dy/len*Math.min(1,len/(rect.width*.30));nub.style.transform='translate('+motion.x*r+'px,'+motion.y*r+'px)'}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);stickMove(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)stickMove(e)});function stop(e){if(pointer!==e.pointerId)return;pointer=null;motion={x:0,y:0};nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if('arrowup arrowdown arrowleft arrowright'.includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function text(s,x,y,col='#ecf3ff',size=12){ctx.fillStyle=col;ctx.font='bold '+size+'px monospace';ctx.textAlign='center';ctx.fillText(s,Math.round(x),Math.round(y))}

const roofPalette=['#405166','#585668','#786552','#526358','#495d67','#706152'];
function sprinkle(x,y,w,h,color,step=44){for(let i=x+15;i<x+w-15;i+=step)for(let j=y+15;j<y+h-15;j+=step){if(((i*13+j*7)|0)%4===0)rect(i,j,3,3,color)}}
function tree(x,y,r=1){ctx.save();ctx.translate(x,y);ctx.scale(r,r);rect(-7,4,14,24,'#4b382b');rect(-29,-17,56,36,'#1a382a');rect(-20,-30,40,22,'#285039');rect(-13,-37,24,12,'#3b6b4a');rect(8,-20,8,5,'#517552');ctx.restore()}
function lamp(x,y){rect(x-3,y-39,6,39,'#3c505b');rect(x-9,y-42,18,8,'#293842');rect(x-7,y-36,14,4,'#efcf87');rect(x-12,y,24,4,'#222b31');ctx.fillStyle='#e6b96b19';ctx.beginPath();ctx.arc(x,y+7,34,0,Math.PI*2);ctx.fill()}
function drawRoads(){
  rect(0,0,W,H,'#456651');
  for(let x=0;x<W;x+=52)for(let y=0;y<H;y+=52){if((x*5+y*7)%13<5)rect(x+13,y+16,3,5,'#59785b')}
  for(const a of [[0,575,W,235],[690,0,160,H],[1445,0,165,H],[0,1395,W,155]]){
    rect(a[0]-15,a[1]-15,a[2]+30,a[3]+30,'#9ba19b');rect(a[0]-8,a[1]-8,a[2]+16,a[3]+16,'#596267');rect(...a,'#333f48');
  }
  for(let x=0;x<W;x+=110){rect(x,682,52,6,'#c5ba95');rect(x,1466,52,6,'#c5ba95')}
  for(let y=0;y<H;y+=100){rect(768,y,7,51,'#c5ba95');rect(1526,y,7,51,'#c5ba95')}
  for(const y of [580,808])for(let x=0;x<W;x+=130){rect(x,y,64,3,'#798184')}
  for(const x of [689,853,1444,1610])for(let y=0;y<H;y+=130){rect(x,y,3,70,'#798184')}
  for(let x of [698,1452])for(let y of [558,790,1380])for(let a=0;a<8;a++)rect(x+a*18,y,12,28,'#d5d1bb');
  for(const p of [[85,530],[610,540],[918,540],[1390,530],[1770,540],[240,1340],[710,1330],[1170,1340],[1660,1330],[2040,1340]])lamp(...p);
  for(const p of [[100,100],[680,107],[1330,120],[2100,190],[2100,950],[180,510],[1060,445],[1320,460],[1660,450],[2100,1330],[850,1340],[1150,1370],[390,1490],[2000,1500]])tree(...p,1.1);
  for(const y of [400,980,1120])for(let x of [920,1180,1900]){rect(x,y,75,12,'#8d9891');rect(x+10,y+3,55,4,'#c3c8bc')}
}
function drawBuilding(b,i){
  const shade=roofPalette[i%roofPalette.length];
  rect(b.x-13,b.y-13,b.w+26,b.h+26,'#8b9288');
  rect(b.x+13,b.y+16,b.w,b.h,'#0f1b23');
  rect(b.x,b.y,b.w,b.h,'#222d35');
  rect(b.x+7,b.y+8,b.w-14,b.h-17,shade);
  rect(b.x+14,b.y+14,b.w-28,8,'#a5ac9a');
  for(let x=b.x+38;x<b.x+b.w-25;x+=96){
    rect(x,b.y+38,44,33,'#202c35');rect(x+4,b.y+42,36,25,'#8dafb8');
    rect(x,b.y+b.h-95,44,33,'#202c35');rect(x+4,b.y+b.h-91,36,25,'#65909e');
  }
  for(let x=b.x+25;x<b.x+b.w-20;x+=118){
    rect(x,b.y+96,55,27,'#252e33');rect(x+8,b.y+103,39,13,'#70828a');
  }
  rect(b.x,b.y+b.h-37,b.w,37,'#253743');
  rect(b.x+b.w/2-29,b.y+b.h-37,58,40,'#a09c85');
  rect(b.x+b.w/2-24,b.y+b.h-32,48,33,'#263e4a');
  rect(b.x+b.w/2+15,b.y+b.h-15,4,4,'#dcc98c');
  text(b.name,b.x+b.w/2,b.y+b.h-50,'#f2dfac',14);
  if(i===0){text('★ POLICE',b.x+b.w/2,b.y+108,'#efce87',22);}
  if(i===3){for(let x=b.x+27;x<b.x+b.w-20;x+=88){rect(x,b.y+b.h+13,3,36,'#e9e0c1')}}
}
function parkedCar(x,y,body='#6f7b80'){rect(x-17,y-33,34,66,'#192229');rect(x-16,y-30,32,60,body);rect(x-13,y-16,26,22,'#243c49');rect(x-13,y+13,26,7,'#263c45');rect(x-12,y-30,9,4,'#f0cfa3');rect(x+3,y+26,9,4,'#a24545')}
function crimeScene(){
  rect(210,1148,460,219,'#7f8880');
  rect(218,1158,444,200,'#525b58');
  for(let x=222;x<645;x+=38)rect(x,1158,4,198,'#636c66');
  for(const p of [[285,1202],[650,1228],[300,1338],[650,1339]]){
    rect(p[0]-8,p[1],16,19,'#c77a3f');rect(p[0]-12,p[1]+15,24,5,'#ecd6a4');
  }
  rect(235,1165,415,5,'#d6ae42');rect(235,1350,415,5,'#d6ae42');
  for(let x=235;x<640;x+=42){rect(x,1165,15,5,'#2b2b2b');rect(x,1350,15,5,'#2b2b2b')}
  rect(350,1216,37,6,'#83c4d8');rect(366,1226,13,10,'#a6d0d9');
  rect(558,1184,19,10,'#4b514a');rect(550,1194,30,5,'#222f2a');
  rect(490,1297,23,15,'#414a4d');rect(507,1306,19,8,'#7d8178');
  for(let a=0;a<5;a++)rect(320+a*14,1295+(a%2)*8,8,3,'#c1bba5');
  text('CRIME SCENE',438,1178,'#ecd185',11);
  rect(292,1096,83,42,'#4f6263');text('EVIDENCE',335,1122,'#ecd485',9);
}
function drawNPC(x,y,color='#81705b',badge=false){
  const bob=(Math.floor(frame/14)%2===0)?0:1;
  rect(x-11,y+17,23,7,'#142028');
  rect(x-10,y-12+bob,20,27,color);
  rect(x-7,y-27+bob,14,16,'#d1a486');
  rect(x-8,y-29+bob,16,5,'#3a302e');
  rect(x-8,y+14+bob,6,12,'#263744');
  rect(x+2,y+14-bob,6,12,'#263744');
  if(badge)rect(x-6,y-5+bob,4,5,'#efd297')
}
function drawOfficer(x,y){
  const stride=moving?Math.sin(walkPhase):0;
  ctx.save();ctx.translate(Math.round(x),Math.round(y));
  rect(-13,19,27,7,'#142129');
  rect(-9,-18,18,26,'#243c5e');
  rect(-6,-32,12,15,'#d8ae8b');
  rect(-10,-36,20,7,'#202e3f');
  rect(-10,-24,20,6,'#263448');
  rect(-8,-8,16,5,'#111d2c');
  rect(-9,8+stride*5,7,16,'#172b3f');rect(2,8-stride*5,7,16,'#172b3f');
  rect(-14,-15-stride*3,5,19,'#293f60');rect(9,-15+stride*3,5,19,'#293f60');
  rect(4,-12,4,5,'#e2be74');rect(-9,-9,4,8,'#131e29');
  if(Math.abs(faceX)>Math.abs(faceY)){rect(faceX>0?5:-8,-28,4,4,'#222629')}
  else if(faceY<0){rect(-6,-28,12,6,'#323d44')}
  ctx.restore()
}
function drawCruiser(x,y,angle=0){
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(angle);
  rect(-28,-45,56,90,'#0f1c23');rect(-25,-43,50,86,'#eeece4');
  rect(-21,-40,42,20,'#1d3547');rect(-21,20,42,15,'#263b47');
  rect(-24,-15,48,27,'#f1eee7');rect(-24,-7,48,8,'#172b3b');
  rect(-28,-28,5,18,'#17202a');rect(23,-28,5,18,'#17202a');
  rect(-28,16,5,19,'#17202a');rect(23,16,5,19,'#17202a');
  rect(-19,-47,11,7,'#f0d6a7');rect(8,-47,11,7,'#f0d6a7');
  rect(-19,40,11,5,'#a3444a');rect(8,40,11,5,'#a3444a');
  const blink=Math.floor(frame/13)%2===0;
  rect(-17,-17,16,6,blink?'#d94f53':'#782b33');
  rect(1,-17,16,6,blink?'#467db6':'#8bc9ef');
  rect(-14,13,28,5,'#1e3d53');text('052',0,4,'#1a2f3c',11);
  if(moving&&driving&&frame%8<4){rect(-20,45,7,6,'#b4b3a1');rect(13,45,7,6,'#b4b3a1')}
  ctx.restore()
}
function drawPrisoner(x,y){drawNPC(x,y,'#4c6589');rect(x-9,y+1,18,5,'#d5d2c5');text('CUFFED',x,y-52,'#e7c484',11)}
function drawMarker(o){
  const isEvidence=['glass','print','camera'].includes(o.kind);
  const pulse=2+Math.sin(frame*.07)*3;
  ctx.beginPath();ctx.arc(o.x,o.y,19+pulse,0,Math.PI*2);
  ctx.fillStyle=isEvidence?'#64c4d64d':'#f0c26555';ctx.fill();
  ctx.strokeStyle=isEvidence?'#86d5e2':'#f6d593';ctx.lineWidth=2;ctx.stroke();
  if(o.kind==='car'){drawCruiser(car.x,car.y,0)}
  else if(o.kind==='witness'||o.kind==='suspect')drawNPC(o.x,o.y,o.kind==='suspect'?'#425c88':'#986f63');
  else{rect(o.x-12,o.y-11,24,23,'#0f212b');text(isEvidence?'◆':o.icon,o.x,o.y+7,isEvidence?'#8bd6df':'#ecd392',24)}
  rect(o.x-56,o.y-64,112,20,'#111c25d9');text(o.label.toUpperCase(),o.x,o.y-50,'#eee8d7',11)
}
function drawMiniMap(){
  rect(vw-119,vh-129,108,108,'#0e1922ea');ctx.strokeStyle='#7c97a0';ctx.lineWidth=1;ctx.strokeRect(vw-119,vh-129,108,108);
  const mx=vw-113,my=vh-122,wm=96,hm=92;
  rect(mx,my,wm,hm,'#466750');
  rect(mx,my+575/H*hm,wm,235/H*hm,'#43505c');rect(mx+690/W*wm,my,160/W*wm,hm,'#43505c');rect(mx+1445/W*wm,my,165/W*wm,hm,'#43505c');
  for(let i=0;i<blocks.length;i++){const b=blocks[i];rect(mx+b.x/W*wm,my+b.y/H*hm,b.w/W*wm,b.h/H*hm,'#889091')}
  rect(mx+player.x/W*wm-3,my+player.y/H*hm-3,7,7,'#f1cf84');
  if(!finished)rect(mx+490/W*wm-2,my+1195/H*hm-2,5,5,'#79cde3')
}
function draw(){
  scale=Math.min(vw/460,vh/380)*1.18;scale=Math.max(.65,Math.min(scale,1.9));
  camX=player.x-vw/(2*scale);camY=player.y-vh/(2*scale);camX=Math.max(0,Math.min(W-vw/scale,camX));camY=Math.max(0,Math.min(H-vh/scale,camY));
  ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
  drawRoads();
  blocks.forEach((b,i)=>drawBuilding(b,i));
  for(const p of [[330,490],[980,770],[1210,510],[1810,788],[1980,1240]])parkedCar(...p,['#536d79','#7c6156','#526a63','#848782','#656983'][(p[0]/10|0)%5]);
  crimeScene();
  for(const o of objects){if(driving&&o.kind==='car')continue;if(arrested&&o.kind==='suspect')continue;if(evidence.has(o.kind))continue;drawMarker(o)}
  if(custody==='vehicle'){text('PRISONER ON BOARD',player.x,player.y-69,'#f4d28e',11)}
  if(custody==='booked'){text('JAIL: OCCUPIED',jailPoint.x,jailPoint.y-75,'#e9c987',11)}
  if(driving)drawCruiser(player.x,player.y,driveAngle);else drawOfficer(player.x,player.y);
  if(arrested&&custody==='escort')drawPrisoner(prisoner.x,prisoner.y);
  ctx.restore();
  // Subtle dusk grading and screen texture; touch controls remain HTML overlays.
  const g=ctx.createRadialGradient(vw/2,vh/2,40,vw/2,vh/2,Math.max(vw,vh)*.72);
  g.addColorStop(0,'#00000000');g.addColorStop(1,'#02071066');ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  for(let y=0;y<vh;y+=5)rect(0,y,vw,1,'#07111b0c');
  drawMiniMap();
  if(performance.now()>noticeUntil)msg.style.display='none';frame++
}
function loop(t){const dt=Math.min((t-tlast)/16.67,2);tlast=t;if(panel.style.display!=='block'){let dx=motion.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=motion.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const len=Math.max(1,Math.hypot(dx,dy)),speed=(driving?10:3.5)*dt;moving=Math.hypot(dx,dy)>.07;if(moving){faceX=dx;faceY=dy;walkPhase+=dt*.30;if(driving)driveAngle=Math.atan2(dy,dx)+Math.PI/2;}moveSolid(player,dx/len*speed,dy/len*speed,driving?25:13);if(driving){car.x=player.x;car.y=player.y}else followPrisoner(dt);if(frame%12===0)updateText()}draw();requestAnimationFrame(loop)}
updateText();say('📻 Dispatch to P-1: burglary at Northwood Electronics, southwest district. Respond and investigate!');requestAnimationFrame(loop);
})();
